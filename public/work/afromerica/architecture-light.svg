<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 970" width="720" height="970" role="img" aria-label="Afromerica competition platform architecture: Next.js on Vercel with Supabase, Paystack, Resend and Sentry" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Afromerica competition platform architecture: Next.js on Vercel with Supabase, Paystack, Resend and Sentry</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6d6d66"/></marker></defs><rect width="720" height="970" fill="#faf9f6"/><rect x="30" y="24" width="206" height="90" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="133.0" y="61.8" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Fans</text><text x="133.0" y="87" text-anchor="middle" font-size="16.8" fill="#6d6d66">vote, buy tickets</text><path d="M133,114 L133,142" fill="none" stroke="#6d6d66" stroke-width="1.5"/><rect x="257" y="24" width="206" height="90" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="360.0" y="61.8" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Judges</text><text x="360.0" y="87" text-anchor="middle" font-size="16.8" fill="#6d6d66">score with a code</text><path d="M360,114 L360,142" fill="none" stroke="#6d6d66" stroke-width="1.5"/><rect x="484" y="24" width="206" height="90" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="587.0" y="61.8" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Admins</text><text x="587.0" y="87" text-anchor="middle" font-size="16.8" fill="#6d6d66">events and finale</text><path d="M587,114 L587,142" fill="none" stroke="#6d6d66" stroke-width="1.5"/><path d="M133,142 L587,142" fill="none" stroke="#6d6d66" stroke-width="1.5"/><path d="M552,142 L552,221" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="170" width="275" height="440" fill="#f1efe9" stroke="#d6d3c9"/><text x="50" y="206.0" font-size="15.6" letter-spacing="1.8" font-weight="600" fill="#6d6d66">SUPABASE</text><rect x="50" y="225" width="235" height="90" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="262.8" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Realtime</text><text x="167.5" y="288" text-anchor="middle" font-size="16.8" fill="#6d6d66">pushes score changes</text><path d="M50,357 a117.5,12 0 0 1 235,0 v126 a117.5,12 0 0 1 -235,0 z" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><path d="M50,357 a117.5,12 0 0 0 235,0" fill="none" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="393.6" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Postgres</text><text x="167.5" y="418.8" text-anchor="middle" font-size="16.8" fill="#6d6d66">row-level security,</text><text x="167.5" y="444" text-anchor="middle" font-size="16.8" fill="#6d6d66">weighted scoring</text><text x="167.5" y="469.2" text-anchor="middle" font-size="16.8" fill="#6d6d66">functions</text><rect x="50" y="515" width="235" height="64" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="552.4" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Auth</text><rect x="30" y="640" width="275" height="300" fill="#f1efe9" stroke="#d6d3c9"/><text x="50" y="676.0" font-size="15.6" letter-spacing="1.8" font-weight="600" fill="#6d6d66">SERVICES</text><rect x="50" y="695" width="235" height="100" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="725.2" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Resend</text><text x="167.5" y="750.4" text-anchor="middle" font-size="16.8" fill="#6d6d66">one-time codes and</text><text x="167.5" y="775.6" text-anchor="middle" font-size="16.8" fill="#6d6d66">confirmations</text><rect x="50" y="815" width="235" height="100" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="845.2" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Sentry</text><text x="167.5" y="870.4" text-anchor="middle" font-size="16.8" fill="#6d6d66">errors from server</text><text x="167.5" y="895.6" text-anchor="middle" font-size="16.8" fill="#6d6d66">and browser</text><rect x="415" y="170" width="275" height="595" fill="#f1efe9" stroke="#d6d3c9"/><text x="435" y="206.0" font-size="15.6" letter-spacing="1.8" font-weight="600" fill="#6d6d66">VERCEL</text><rect x="435" y="225" width="235" height="110" fill="#ffffff" stroke="#1f6f78" stroke-width="1.75"/><text x="552.5" y="260.2" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Next.js 16</text><text x="552.5" y="285.4" text-anchor="middle" font-size="16.8" fill="#6d6d66">public pages, voting,</text><text x="552.5" y="310.6" text-anchor="middle" font-size="16.8" fill="#6d6d66">admin dashboard</text><rect x="435" y="375" width="235" height="180" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="552.5" y="432.6" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">API routes (23)</text><text x="552.5" y="457.8" text-anchor="middle" font-size="16.8" fill="#6d6d66">votes, tickets, finale</text><text x="552.5" y="483" text-anchor="middle" font-size="16.8" fill="#6d6d66">scoring, one-time</text><text x="552.5" y="508.2" text-anchor="middle" font-size="16.8" fill="#6d6d66">codes, payments</text><rect x="435" y="600" width="235" height="135" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="552.5" y="635.1" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Payment webhook</text><text x="552.5" y="660.3" text-anchor="middle" font-size="16.8" fill="#6d6d66">HMAC-SHA512 signature,</text><text x="552.5" y="685.5" text-anchor="middle" font-size="16.8" fill="#6d6d66">idempotent, recorded</text><text x="552.5" y="710.7" text-anchor="middle" font-size="16.8" fill="#6d6d66">in Postgres</text><rect x="415" y="795" width="275" height="145" fill="#f1efe9" stroke="#d6d3c9"/><text x="435" y="831.0" font-size="15.6" letter-spacing="1.8" font-weight="600" fill="#6d6d66">PAYMENTS</text><rect x="435" y="850" width="235" height="80" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="552.5" y="882.8" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Paystack</text><text x="552.5" y="908" text-anchor="middle" font-size="16.8" fill="#6d6d66">votes and tickets</text><path d="M285,270 L431,270" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="304.74" y="254.4" width="110.52" height="26.4" rx="2" fill="#faf9f6"/><text x="360" y="274.8" text-anchor="middle" font-size="15.6" fill="#1c1c1a">live scores</text><path d="M167,345 L167,319" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M435,420 L289,420" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="321.78" y="404.4" width="76.44" height="26.4" rx="2" fill="#faf9f6"/><text x="360" y="424.8" text-anchor="middle" font-size="15.6" fill="#1c1c1a">queries</text><path d="M435,545 L289,545" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="317.52" y="529.4" width="84.96" height="26.4" rx="2" fill="#faf9f6"/><text x="360" y="549.8" text-anchor="middle" font-size="15.6" fill="#1c1c1a">sessions</text><path d="M435,715 L289,715" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="330.3" y="699.4" width="59.4" height="26.4" rx="2" fill="#faf9f6"/><text x="360" y="719.8" text-anchor="middle" font-size="15.6" fill="#1c1c1a">email</text><path d="M670,450 L705,450 L705,890 L674,890" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M552,850 L552,739" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="483.96" y="764.4" width="136.08" height="26.4" rx="2" fill="#faf9f6"/><text x="552" y="784.8" text-anchor="middle" font-size="15.6" fill="#1c1c1a">charge.success</text></svg>