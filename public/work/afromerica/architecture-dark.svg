<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Afromerica competition platform architecture: Next.js on Vercel with Supabase, Paystack, Resend and Sentry" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Afromerica competition platform architecture: Next.js on Vercel with Supabase, Paystack, Resend and Sentry</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a3a39c"/></marker></defs><rect width="1600" height="900" fill="#111110"/><rect x="60" y="90" width="250" height="80" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="185.0" y="124.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Fans</text><text x="185.0" y="145.0" text-anchor="middle" font-size="14" fill="#a3a39c">vote and buy tickets</text><rect x="60" y="230" width="250" height="80" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="185.0" y="264.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Judges</text><text x="185.0" y="285.0" text-anchor="middle" font-size="14" fill="#a3a39c">score with a voter code</text><rect x="60" y="370" width="250" height="80" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="185.0" y="404.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Admins</text><text x="185.0" y="425.0" text-anchor="middle" font-size="14" fill="#a3a39c">events, artists, finale</text><rect x="370" y="40" width="560" height="820" fill="#1a1a18" stroke="#33332f"/><text x="390" y="70" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">VERCEL</text><rect x="420" y="100" width="440" height="110" fill="#202020" stroke="#7cc9c4" stroke-width="1.75"/><text x="640.0" y="138.5" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Next.js 16</text><text x="640.0" y="159.5" text-anchor="middle" font-size="14" fill="#a3a39c">public pages, voting screens,</text><text x="640.0" y="180.5" text-anchor="middle" font-size="14" fill="#a3a39c">admin dashboard</text><rect x="420" y="310" width="440" height="124" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="640.0" y="355.5" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">API routes (23)</text><text x="640.0" y="376.5" text-anchor="middle" font-size="14" fill="#a3a39c">votes, tickets, finale scoring,</text><text x="640.0" y="397.5" text-anchor="middle" font-size="14" fill="#a3a39c">one-time codes, payments</text><rect x="420" y="560" width="440" height="124" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="640.0" y="605.5" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">/api/payments/webhook</text><text x="640.0" y="626.5" text-anchor="middle" font-size="14" fill="#a3a39c">HMAC-SHA512 signature, idempotent,</text><text x="640.0" y="647.5" text-anchor="middle" font-size="14" fill="#a3a39c">records the payment in Postgres</text><rect x="1000" y="40" width="540" height="420" fill="#1a1a18" stroke="#33332f"/><text x="1020" y="70" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">SUPABASE</text><rect x="1050" y="96" width="440" height="76" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="128.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Realtime</text><text x="1270.0" y="149.0" text-anchor="middle" font-size="14" fill="#a3a39c">pushes score changes</text><path d="M1050,222 a220.0,12 0 0 1 440,0 v100 a220.0,12 0 0 1 -440,0 z" fill="#202020" stroke="#ededea" stroke-width="1.25"/><path d="M1050,222 a220.0,12 0 0 0 440,0" fill="none" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="261.5" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Postgres</text><text x="1270.0" y="282.5" text-anchor="middle" font-size="14" fill="#a3a39c">row-level security,</text><text x="1270.0" y="303.5" text-anchor="middle" font-size="14" fill="#a3a39c">weighted scoring functions</text><rect x="1050" y="366" width="440" height="64" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="402.5" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Auth</text><rect x="1000" y="500" width="540" height="360" fill="#1a1a18" stroke="#33332f"/><text x="1020" y="530" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">SERVICES</text><rect x="1050" y="552" width="440" height="76" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="584.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Paystack</text><text x="1270.0" y="605.0" text-anchor="middle" font-size="14" fill="#a3a39c">checkout for votes and tickets</text><rect x="1050" y="656" width="440" height="76" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="688.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Resend</text><text x="1270.0" y="709.0" text-anchor="middle" font-size="14" fill="#a3a39c">one-time codes and confirmations</text><rect x="1050" y="760" width="440" height="76" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="792.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Sentry</text><text x="1270.0" y="813.0" text-anchor="middle" font-size="14" fill="#a3a39c">errors from server and browser</text><path d="M310,130 L420,137.5" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310,270 L420,155.0" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310,410 L420,172.5" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M640,210 L640,310" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1050,134 L860,150" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="891.2" y="115" width="127.6" height="22" rx="2" fill="#111110"/><text x="955.0" y="131" text-anchor="middle" font-size="13" fill="#ededea">live leaderboard</text><path d="M1270,210 L1270,172" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M860,350 L1050,272" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="923.15" y="287" width="63.699999999999996" height="22" rx="2" fill="#111110"/><text x="955.0" y="303" text-anchor="middle" font-size="13" fill="#ededea">queries</text><path d="M860,400 L1050,398" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="919.6" y="373" width="70.8" height="22" rx="2" fill="#111110"/><text x="955.0" y="389" text-anchor="middle" font-size="13" fill="#ededea">sessions</text><path d="M860,425 L900,425 L900,590 L1050,590" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="911.85" y="565" width="106.3" height="22" rx="2" fill="#111110"/><text x="965.0" y="581" text-anchor="middle" font-size="13" fill="#ededea">start payment</text><path d="M1050,610 L860,615" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="898.3" y="619" width="113.39999999999999" height="22" rx="2" fill="#111110"/><text x="955.0" y="635" text-anchor="middle" font-size="13" fill="#ededea">charge.success</text><path d="M860,660 L1050,694" fill="none" stroke="#a3a39c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="901.85" y="679" width="106.3" height="22" rx="2" fill="#111110"/><text x="955.0" y="695" text-anchor="middle" font-size="13" fill="#ededea">confirmations</text></svg>