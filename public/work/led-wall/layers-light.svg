<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" role="img" aria-label="LED wall configuration layers: five layers from receiving cards up to input and layers, each with the fault found and the fix applied" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>LED wall configuration layers: five layers from receiving cards up to input and layers, each with the fault found and the fix applied</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6d6d66"/></marker></defs><rect width="1600" height="880" fill="#faf9f6"/><text x="70" y="80" font-size="13" letter-spacing="1.8" font-weight="600" fill="#6d6d66">LAYER</text><text x="500" y="80" font-size="13" letter-spacing="1.8" font-weight="600" fill="#6d6d66">FAULT FOUND</text><text x="1030" y="80" font-size="13" letter-spacing="1.8" font-weight="600" fill="#6d6d66">FIX</text><rect x="70" y="104" width="400" height="116" fill="#f1efe9" stroke="#d6d3c9"/><rect x="500" y="104" width="500" height="116" fill="#ffffff" stroke="#6d6d66" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="1030" y="104" width="500" height="116" fill="#ffffff" stroke="#1f6f78" stroke-width="1.75"/><text x="94" y="154" font-size="18" font-weight="600" fill="#1c1c1a">5 · Input and layers</text><text x="94" y="182" text-anchor="start" font-size="15" fill="#6d6d66">What goes on the canvas</text><text x="524" y="154" font-size="16" fill="#1c1c1a">Image Mosaic and PIP 1, 2 on;</text><text x="524" y="180" font-size="16" fill="#1c1c1a">main layer only 2048 × 768</text><text x="1054" y="154" font-size="16" fill="#1c1c1a">Mosaic and PIP off;</text><text x="1054" y="180" font-size="16" fill="#1c1c1a">full-screen 3072 × 1536 layer</text><path d="M1000,162.0 L1026,162.0" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="70" y="238" width="400" height="116" fill="#f1efe9" stroke="#d6d3c9"/><rect x="500" y="238" width="500" height="116" fill="#ffffff" stroke="#6d6d66" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="1030" y="238" width="500" height="116" fill="#ffffff" stroke="#1f6f78" stroke-width="1.75"/><text x="94" y="288" font-size="18" font-weight="600" fill="#1c1c1a">4 · Controller output</text><text x="94" y="316" text-anchor="start" font-size="15" fill="#6d6d66">Total pixels it can drive</text><text x="524" y="288" font-size="16" fill="#1c1c1a">VX600 rated 3.9M px, wall is 4.7M;</text><text x="524" y="314" font-size="16" fill="#1c1c1a">on the Pro, 3D halved capacity</text><text x="1054" y="288" font-size="16" fill="#1c1c1a">VX1000 Pro (6.5M px), 3D off,</text><text x="1054" y="314" font-size="16" fill="#1c1c1a">3072 × 1536 @ 60 Hz</text><path d="M1000,296.0 L1026,296.0" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="70" y="372" width="400" height="116" fill="#f1efe9" stroke="#d6d3c9"/><rect x="500" y="372" width="500" height="116" fill="#ffffff" stroke="#6d6d66" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="1030" y="372" width="500" height="116" fill="#ffffff" stroke="#1f6f78" stroke-width="1.75"/><text x="94" y="422" font-size="18" font-weight="600" fill="#1c1c1a">3 · Screen connection</text><text x="94" y="450" text-anchor="start" font-size="15" fill="#6d6d66">Port-to-cabinet map</text><text x="524" y="422" font-size="16" fill="#1c1c1a">Vertical chains of 3 on 4 rows;</text><text x="524" y="448" font-size="16" fill="#1c1c1a">grid still set to 4 × 2</text><text x="1054" y="422" font-size="16" fill="#1c1c1a">8 horizontal chains of 3;</text><text x="1054" y="448" font-size="16" fill="#1c1c1a">6 × 4 grid matched to cabling</text><path d="M1000,430.0 L1026,430.0" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="70" y="506" width="400" height="116" fill="#f1efe9" stroke="#d6d3c9"/><rect x="500" y="506" width="500" height="116" fill="#ffffff" stroke="#6d6d66" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="1030" y="506" width="500" height="116" fill="#ffffff" stroke="#1f6f78" stroke-width="1.75"/><text x="94" y="556" font-size="18" font-weight="600" fill="#1c1c1a">2 · Cabinet definition</text><text x="94" y="584" text-anchor="start" font-size="15" fill="#6d6d66">Pixels per receiving card</text><text x="524" y="556" font-size="16" fill="#1c1c1a">Module size 256 × 128 entered</text><text x="524" y="582" font-size="16" fill="#1c1c1a">as the cabinet size</text><text x="1054" y="556" font-size="16" fill="#1c1c1a">512 × 384 per cabinet</text><text x="1054" y="582" font-size="16" fill="#1c1c1a">(2 × 3 modules)</text><path d="M1000,564.0 L1026,564.0" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="70" y="640" width="400" height="116" fill="#f1efe9" stroke="#d6d3c9"/><rect x="500" y="640" width="500" height="116" fill="#ffffff" stroke="#6d6d66" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="1030" y="640" width="500" height="116" fill="#ffffff" stroke="#1f6f78" stroke-width="1.75"/><text x="94" y="690" font-size="18" font-weight="600" fill="#1c1c1a">1 · Receiving cards</text><text x="94" y="718" text-anchor="start" font-size="15" fill="#6d6d66">Chip, scan and timing</text><text x="524" y="690" font-size="16" fill="#1c1c1a">Generic common-chip, static-scan</text><text x="524" y="716" font-size="16" fill="#1c1c1a">profile on all 24 cards</text><text x="1054" y="690" font-size="16" fill="#1c1c1a">Factory ICND2165, 1/64-scan</text><text x="1054" y="716" font-size="16" fill="#1c1c1a">profile loaded and saved</text><path d="M1000,698.0 L1026,698.0" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="840" text-anchor="start" font-size="14" fill="#6d6d66">Each layer relies on the one below it, and every layer held its own fault.</text></svg>