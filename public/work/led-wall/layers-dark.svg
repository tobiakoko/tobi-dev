<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1290" width="720" height="1290" role="img" aria-label="LED wall configuration layers: five layers from receiving cards up to input and layers, each with the fault found and the fix applied" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>LED wall configuration layers: five layers from receiving cards up to input and layers, each with the fault found and the fix applied</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a3a39c"/></marker></defs><rect width="720" height="1290" fill="#111110"/><rect x="30" y="30" width="660" height="226" fill="#202020" stroke="#33332f"/><rect x="30" y="30" width="660" height="60" fill="#1a1a18" stroke="#33332f"/><text x="54" y="68" font-size="21" font-weight="600" fill="#ededea">5 · Input and layers</text><text x="666" y="68" text-anchor="end" font-size="16" fill="#a3a39c">What goes on the canvas</text><text x="54" y="126" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">FAULT</text><text x="140" y="126" font-size="18" fill="#ededea">Image Mosaic and PIP 1, 2 on;</text><text x="140" y="152" font-size="18" fill="#ededea">main layer only 2048 × 768</text><text x="54" y="202" font-size="13" letter-spacing="1.8" font-weight="600" fill="#7cc9c4">FIX</text><text x="140" y="202" font-size="18" fill="#ededea">Mosaic and PIP off;</text><text x="140" y="228" font-size="18" fill="#ededea">full-screen 3072 × 1536 layer</text><rect x="126" y="182" width="3" height="56" fill="#7cc9c4"/><rect x="30" y="272" width="660" height="226" fill="#202020" stroke="#33332f"/><rect x="30" y="272" width="660" height="60" fill="#1a1a18" stroke="#33332f"/><text x="54" y="310" font-size="21" font-weight="600" fill="#ededea">4 · Controller output</text><text x="666" y="310" text-anchor="end" font-size="16" fill="#a3a39c">Total pixels it can drive</text><text x="54" y="368" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">FAULT</text><text x="140" y="368" font-size="18" fill="#ededea">VX600 rated 3.9M px, wall is 4.7M;</text><text x="140" y="394" font-size="18" fill="#ededea">on the Pro, 3D halved capacity</text><text x="54" y="444" font-size="13" letter-spacing="1.8" font-weight="600" fill="#7cc9c4">FIX</text><text x="140" y="444" font-size="18" fill="#ededea">VX1000 Pro (6.5M px), 3D off,</text><text x="140" y="470" font-size="18" fill="#ededea">3072 × 1536 @ 60 Hz</text><rect x="126" y="424" width="3" height="56" fill="#7cc9c4"/><rect x="30" y="514" width="660" height="226" fill="#202020" stroke="#33332f"/><rect x="30" y="514" width="660" height="60" fill="#1a1a18" stroke="#33332f"/><text x="54" y="552" font-size="21" font-weight="600" fill="#ededea">3 · Screen connection</text><text x="666" y="552" text-anchor="end" font-size="16" fill="#a3a39c">Port-to-cabinet map</text><text x="54" y="610" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">FAULT</text><text x="140" y="610" font-size="18" fill="#ededea">Vertical chains of 3 on 4 rows;</text><text x="140" y="636" font-size="18" fill="#ededea">grid still set to 4 × 2</text><text x="54" y="686" font-size="13" letter-spacing="1.8" font-weight="600" fill="#7cc9c4">FIX</text><text x="140" y="686" font-size="18" fill="#ededea">8 horizontal chains of 3;</text><text x="140" y="712" font-size="18" fill="#ededea">6 × 4 grid matched to cabling</text><rect x="126" y="666" width="3" height="56" fill="#7cc9c4"/><rect x="30" y="756" width="660" height="226" fill="#202020" stroke="#33332f"/><rect x="30" y="756" width="660" height="60" fill="#1a1a18" stroke="#33332f"/><text x="54" y="794" font-size="21" font-weight="600" fill="#ededea">2 · Cabinet definition</text><text x="666" y="794" text-anchor="end" font-size="16" fill="#a3a39c">Pixels per receiving card</text><text x="54" y="852" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">FAULT</text><text x="140" y="852" font-size="18" fill="#ededea">Module size 256 × 128 entered</text><text x="140" y="878" font-size="18" fill="#ededea">as the cabinet size</text><text x="54" y="928" font-size="13" letter-spacing="1.8" font-weight="600" fill="#7cc9c4">FIX</text><text x="140" y="928" font-size="18" fill="#ededea">512 × 384 per cabinet</text><text x="140" y="954" font-size="18" fill="#ededea">(2 × 3 modules)</text><rect x="126" y="908" width="3" height="56" fill="#7cc9c4"/><rect x="30" y="998" width="660" height="226" fill="#202020" stroke="#33332f"/><rect x="30" y="998" width="660" height="60" fill="#1a1a18" stroke="#33332f"/><text x="54" y="1036" font-size="21" font-weight="600" fill="#ededea">1 · Receiving cards</text><text x="666" y="1036" text-anchor="end" font-size="16" fill="#a3a39c">Chip, scan and timing</text><text x="54" y="1094" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">FAULT</text><text x="140" y="1094" font-size="18" fill="#ededea">Generic common-chip, static-scan</text><text x="140" y="1120" font-size="18" fill="#ededea">profile on all 24 cards</text><text x="54" y="1170" font-size="13" letter-spacing="1.8" font-weight="600" fill="#7cc9c4">FIX</text><text x="140" y="1170" font-size="18" fill="#ededea">Factory ICND2165, 1/64-scan</text><text x="140" y="1196" font-size="18" fill="#ededea">profile loaded and saved</text><rect x="126" y="1150" width="3" height="56" fill="#7cc9c4"/><text x="30" y="1264" text-anchor="start" font-size="16" fill="#a3a39c">Each layer relies on the one below it, and every layer held its own fault.</text></svg>