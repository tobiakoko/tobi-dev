<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-label="Lewisville church website architecture: Next.js on Vercel reading Sanity, with webhook revalidation, a contact API and YouTube" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Lewisville church website architecture: Next.js on Vercel reading Sanity, with webhook revalidation, a contact API and YouTube</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a3a39c"/></marker></defs><rect width="1600" height="980" fill="#111110"/><rect x="60" y="80" width="250" height="84" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="185.0" y="116.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Church staff</text><text x="185.0" y="137.0" text-anchor="middle" font-size="14" fill="#a3a39c">edit in Sanity Studio</text><rect x="60" y="300" width="250" height="84" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="185.0" y="336.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Visitors</text><text x="185.0" y="357.0" text-anchor="middle" font-size="14" fill="#a3a39c">phones and desktops</text><rect x="370" y="40" width="560" height="900" fill="#1a1a18" stroke="#33332f"/><text x="390" y="70" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">VERCEL</text><rect x="420" y="96" width="440" height="100" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="640.0" y="129.5" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">/api/revalidate</text><text x="640.0" y="150.5" text-anchor="middle" font-size="14" fill="#a3a39c">checks Sanity&#x27;s signature,</text><text x="640.0" y="171.5" text-anchor="middle" font-size="14" fill="#a3a39c">refreshes only what changed</text><rect x="420" y="262" width="440" height="116" fill="#202020" stroke="#7cc9c4" stroke-width="1.75"/><text x="640.0" y="303.5" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Next.js 16 App Router</text><text x="640.0" y="324.5" text-anchor="middle" font-size="14" fill="#a3a39c">static, cached pages</text><text x="640.0" y="345.5" text-anchor="middle" font-size="14" fill="#a3a39c">Home and Sermons refresh every 60 s</text><rect x="420" y="470" width="440" height="104" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="640.0" y="505.5" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">/api/contact</text><text x="640.0" y="526.5" text-anchor="middle" font-size="14" fill="#a3a39c">Zod validation, origin check,</text><text x="640.0" y="547.5" text-anchor="middle" font-size="14" fill="#a3a39c">a typed result for each status code</text><rect x="420" y="664" width="440" height="84" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="640.0" y="700.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">/api/live</text><text x="640.0" y="721.0" text-anchor="middle" font-size="14" fill="#a3a39c">live-stream check, cached 60 s</text><text x="420" y="812" text-anchor="start" font-size="13" fill="#a3a39c">Every pull request (GitHub Actions, Node 22 and 24):</text><text x="420" y="836" text-anchor="start" font-size="13" fill="#a3a39c">typecheck, lint, 333 unit tests, 360 browser runs with axe</text><text x="420" y="860" text-anchor="start" font-size="13" fill="#a3a39c">Preview deployment before each phase merges</text><rect x="1000" y="40" width="540" height="300" fill="#1a1a18" stroke="#33332f"/><text x="1020" y="70" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">SANITY</text><path d="M1050,124 a220.0,12 0 0 1 440,0 v126 a220.0,12 0 0 1 -440,0 z" fill="#202020" stroke="#ededea" stroke-width="1.25"/><path d="M1050,124 a220.0,12 0 0 0 440,0" fill="none" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="166.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Content Lake</text><text x="1270.0" y="187.0" text-anchor="middle" font-size="14" fill="#a3a39c">6 fixed pages</text><text x="1270.0" y="208.0" text-anchor="middle" font-size="14" fill="#a3a39c">7 lists: leaders, ministries, outreach,</text><text x="1270.0" y="229.0" text-anchor="middle" font-size="14" fill="#a3a39c">doctrines, events, sermons, testimonies</text><rect x="1000" y="400" width="540" height="540" fill="#1a1a18" stroke="#33332f"/><text x="1020" y="430" font-size="13" letter-spacing="1.8" font-weight="600" fill="#a3a39c">SERVICES</text><rect x="1050" y="456" width="440" height="80" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="490.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Upstash Redis</text><text x="1270.0" y="511.0" text-anchor="middle" font-size="14" fill="#a3a39c">rate limiting</text><rect x="1050" y="566" width="440" height="80" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="600.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Resend</text><text x="1270.0" y="621.0" text-anchor="middle" font-size="14" fill="#a3a39c">form email to the church inbox</text><rect x="1050" y="676" width="440" height="80" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="710.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">YouTube</text><text x="1270.0" y="731.0" text-anchor="middle" font-size="14" fill="#a3a39c">public channel feed; player loads on Play</text><rect x="1050" y="786" width="440" height="80" fill="#202020" stroke="#ededea" stroke-width="1.25"/><text x="1270.0" y="820.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ededea">Google Analytics</text><text x="1270.0" y="841.0" text-anchor="middle" font-size="14" fill="#a3a39c">loaded in the browser only after consent</text><path d="M310,122 L340,122 L340,18 L1270,18 L1270,112" fill="none" stroke="#a3a39c" stroke-widt