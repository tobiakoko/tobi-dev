<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" width="720" height="1180" role="img" aria-label="Lewisville church website architecture: Next.js on Vercel reading Sanity, with webhook revalidation, a contact API and YouTube" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Lewisville church website architecture: Next.js on Vercel reading Sanity, with webhook revalidation, a contact API and YouTube</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6d6d66"/></marker></defs><rect width="720" height="1180" fill="#faf9f6"/><rect x="30" y="24" width="275" height="90" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="61.8" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Church staff</text><text x="167.5" y="87" text-anchor="middle" font-size="16.8" fill="#6d6d66">edit in Sanity Studio</text><rect x="415" y="24" width="275" height="90" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="552.5" y="61.8" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Visitors</text><text x="552.5" y="87" text-anchor="middle" font-size="16.8" fill="#6d6d66">phones and desktops</text><rect x="30" y="170" width="275" height="310" fill="#f1efe9" stroke="#d6d3c9"/><text x="50" y="206.0" font-size="15.6" letter-spacing="1.8" font-weight="600" fill="#6d6d66">SANITY</text><path d="M50,237 a117.5,12 0 0 1 235,0 v206 a117.5,12 0 0 1 -235,0 z" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><path d="M50,237 a117.5,12 0 0 0 235,0" fill="none" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="288.4" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Content Lake</text><text x="167.5" y="313.6" text-anchor="middle" font-size="16.8" fill="#6d6d66">6 fixed pages</text><text x="167.5" y="338.8" text-anchor="middle" font-size="16.8" fill="#6d6d66">7 lists: leaders,</text><text x="167.5" y="364" text-anchor="middle" font-size="16.8" fill="#6d6d66">ministries, outreach,</text><text x="167.5" y="389.2" text-anchor="middle" font-size="16.8" fill="#6d6d66">doctrines, events,</text><text x="167.5" y="414.4" text-anchor="middle" font-size="16.8" fill="#6d6d66">sermons, testimonies</text><rect x="30" y="520" width="275" height="420" fill="#f1efe9" stroke="#d6d3c9"/><text x="50" y="556.0" font-size="15.6" letter-spacing="1.8" font-weight="600" fill="#6d6d66">SERVICES</text><rect x="50" y="575" width="235" height="90" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="612.8" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Upstash Redis</text><text x="167.5" y="638" text-anchor="middle" font-size="16.8" fill="#6d6d66">rate limiting</text><rect x="50" y="685" width="235" height="100" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="715.2" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Resend</text><text x="167.5" y="740.4" text-anchor="middle" font-size="16.8" fill="#6d6d66">form email to the</text><text x="167.5" y="765.6" text-anchor="middle" font-size="16.8" fill="#6d6d66">church inbox</text><rect x="50" y="805" width="235" height="110" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="167.5" y="840.2" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">YouTube</text><text x="167.5" y="865.4" text-anchor="middle" font-size="16.8" fill="#6d6d66">public channel feed;</text><text x="167.5" y="890.6" text-anchor="middle" font-size="16.8" fill="#6d6d66">player loads on Play</text><rect x="415" y="170" width="275" height="710" fill="#f1efe9" stroke="#d6d3c9"/><text x="435" y="206.0" font-size="15.6" letter-spacing="1.8" font-weight="600" fill="#6d6d66">VERCEL</text><rect x="435" y="225" width="235" height="130" fill="#ffffff" stroke="#1f6f78" stroke-width="1.75"/><text x="552.5" y="257.6" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">Next.js 16</text><text x="552.5" y="282.8" text-anchor="middle" font-size="16.8" fill="#6d6d66">static, cached pages;</text><text x="552.5" y="308" text-anchor="middle" font-size="16.8" fill="#6d6d66">Home and Sermons</text><text x="552.5" y="333.2" text-anchor="middle" font-size="16.8" fill="#6d6d66">refresh every 60 s</text><rect x="435" y="395" width="235" height="125" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="552.5" y="425.1" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">/api/revalidate</text><text x="552.5" y="450.3" text-anchor="middle" font-size="16.8" fill="#6d6d66">checks Sanity’s</text><text x="552.5" y="475.5" text-anchor="middle" font-size="16.8" fill="#6d6d66">signature, refreshes</text><text x="552.5" y="500.7" text-anchor="middle" font-size="16.8" fill="#6d6d66">only what changed</text><rect x="435" y="560" width="235" height="150" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="552.5" y="602.6" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">/api/contact</text><text x="552.5" y="627.8" text-anchor="middle" font-size="16.8" fill="#6d6d66">Zod validation,</text><text x="552.5" y="653" text-anchor="middle" font-size="16.8" fill="#6d6d66">origin check, a typed</text><text x="552.5" y="678.2" text-anchor="middle" font-size="16.8" fill="#6d6d66">result per status code</text><rect x="435" y="750" width="235" height="100" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.25"/><text x="552.5" y="780.2" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1c1c1a">/api/live</text><text x="552.5" y="805.4" text-anchor="middle" font-size="16.8" fill="#6d6d66">live-stream check,</text><text x="552.5" y="830.6" text-anchor="middle" font-size="16.8" fill="#6d6d66">cached 60 s</text><path d="M167,114 L167,166" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="180" y="126.4" width="76.44" height="26.4" rx="2" fill="#faf9f6"/><text x="218.22" y="146.8" text-anchor="middle" font-size="15.6" fill="#1c1c1a">publish</text><path d="M552,114 L552,221" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="564" y="126.4" width="144.6" height="26.4" rx="2" fill="#faf9f6"/><text x="636.3" y="146.8" text-anchor="middle" font-size="15.6" fill="#1c1c1a">pages and forms</text><path d="M285,440 L431,440" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="321.78" y="424.4" width="76.44" height="26.4" rx="2" fill="#faf9f6"/><text x="360" y="444.8" text-anchor="middle" font-size="15.6" fill="#1c1c1a">webhook</text><path d="M435,290 L289,290" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="330.3" y="274.4" width="59.4" height="26.4" rx="2" fill="#faf9f6"/><text x="360" y="294.8" text-anchor="middle" font-size="15.6" fill="#1c1c1a">reads</text><path d="M552,395 L552,359" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M435,620 L289,620" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M435,700 L289,700" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M435,830 L289,830" fill="none" stroke="#6d6d66" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="990" text-anchor="start" font-size="18" fill="#6d6d66">Google Analytics loads in the browser only after consent.</text><text x="30" y="1050" text-anchor="start" font-size="18" fill="#6d6d66">Every pull request (GitHub Actions, Node 22 and 24):</text><text x="30" y="1078" text-anchor="start" font-size="18" fill="#6d6d66">typecheck, lint, 333 unit tests, 360 browser runs with axe.</text><text x="30" y="1106" text-anchor="start" font-size="18" fill="#6d6d66">Preview deployment before each phase merges.</text></svg>